[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "injeval"
version = "0.1.0"
description = "Local indirect prompt injection and tool-call measurement harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "pandas>=2", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
